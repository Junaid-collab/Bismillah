                    <!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Repo Website</title>
  <style>
    body { font-family: sans-serif; background:#f9f9f9; color:#333; padding:20px; }
    h1 { color:#007acc; }
    a { color:#007acc; text-decoration:none; }
  </style>
</head>
<body>
  <h1>Welcome to my repo site!</h1>
  <p>This is a GitHub Pages test site for the repo <strong>Bismillah</strong>.</p>
  <h2>README Content:</h2>
  <pre id="readme">Loading README...</pre>

  <script>
    const OWNER = "junaid-collab";
    const REPO = "Bismillah";
    const BRANCH = "main";

    async function loadReadme() {
      try {
        const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/README.md`;
        const res = await fetch(url);
        const text = await res.text();
        document.getElementById("readme").textContent = text;
      } catch(err) {
        document.getElementById("readme").textContent = "README not found.";
      }
    }

    loadReadme();
  </script>
</body>
</html>
